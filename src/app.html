<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0c1f5b" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
		/>
		<script>
			// Start the two day-independent data files while the document is still
			// parsing, instead of waiting for the app bundle to download, execute and
			// mount. src/lib/transit/assets.ts takes these responses over rather than
			// fetching them a second time.
			window.__transitPreload = new Map(
				['meta.json', 'stops.bin.gz'].map((path) => [
					path,
					fetch(new URL('data/' + path, new URL('.', location))).catch(() => null)
				])
			);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script defer data-domain="wiespätistzuspät.ch" data-api="/pl/api/event" src="/pl/js/script.js"></script>
	</body>
</html>
